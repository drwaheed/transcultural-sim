<script>
(async function(){
  try{
    TCS.load(); TCS.applyTheme(); TCS_UI.shell();
    if(window.TCS_CLOUD&&TCS_CLOUD.enabled) await TCS_CLOUD.init();
    TCS.render();
    if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(TCS.db.settings.theme==='auto'){ TCS.applyTheme(); TCS_UI.shell(); TCS.render(); } });
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML='<main id="main" style="padding:2rem"><h1>حدث خطأ أثناء التحميل / Load error</h1><p>'+String(e.message).replace(/</g,'&lt;')+'</p><p>جرّب تحديث الصفحة أو استيراد نسخة احتياطية. / Try reloading or importing a backup.</p></main>';
  }
})();
</script>
